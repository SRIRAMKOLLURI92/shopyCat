<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container narrow">
    <h1>Log in</h1>
    <p class="notice" th:if="${param.registered}">Account created. Please log in.</p>
    <p class="error" th:if="${param.error}">Wrong email or password.</p>
    <form class="form" method="post" th:action="@{/login}">
        <label>Email <input type="email" name="email" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button class="btn" type="submit">Log in</button>
    </form>
    <p>New here? <a th:href="@{/register}">Create an account</a></p>
    <p class="hint">Demo accounts (password <code>password123</code>): owner@shopycat.dev (shop owner), user@shopycat.dev (user).</p>
</main>
</body>
</html>
