spring.application.name=shopycat

# Local development database: a file in ./data, no install needed.
spring.datasource.url=jdbc:h2:file:./data/shopycat;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Fill the database with demo shops and posts on first start (set to false to turn off).
shopycat.demo-data=true
